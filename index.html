/* ===== CONTROLE DE DATA ===== */
if(hoje>=inicioTreinamento){
document.getElementById("inicio").classList.remove("hidden");
}else{
document.getElementById("bloqueio").classList.remove("hidden");
}

let perguntasAtuais=[];

function iniciar(){
const nome=document.getElementById("nome").value.trim();
if(!nome){alert("Digite seu nome");return;}
perguntasAtuais=perguntasPorMes[hoje.getMonth()];
document.getElementById("inicio").classList.add("hidden");
gerarQuiz();
}

function gerarQuiz(){
const f=document.getElementById("quiz");
f.innerHTML="";
perguntasAtuais.forEach((p,i)=>{
let d=document.createElement("div");
d.className="question";
d.innerHTML=`<strong>${i+1}. ${p.q}</strong><br>`;
p.a.forEach((alt,j)=>{
d.innerHTML+=`<label><input type="radio" name="q${i}" value="${j}"> ${alt}</label><br>`;
});
f.appendChild(d);
});
f.innerHTML+=`<button type="button" onclick="finalizar()">Finalizar Avaliação</button>`;
f.classList.remove("hidden");
}

function finalizar(){
let acertos=0,fb="";
perguntasAtuais.forEach((p,i)=>{
const r=document.querySelector(`input[name="q${i}"]:checked`);
let ok=false;
if(r && parseInt(r.value)===p.c){acertos++;ok=true;}
fb+=`<div><b>${i+1}. ${p.q}</b><br>${ok?"✅ Acertou":"❌ Errou"}<br><em>Resposta correta: ${p.a[p.c]}</em></div><br>`;
});
const nota=((acertos/perguntasAtuais.length)*10).toFixed(1);
fetch(WEB_APP_URL,{method:"POST",mode:"no-cors",headers:{"Content-Type":"application/json"},body:JSON.stringify({nome:document.getElementById("nome").value,unidade:UNIDADE,mesAno:(hoje.getMonth()+1)+"/"+hoje.getFullYear(),nota})});
document.getElementById("quiz").classList.add("hidden");
document.getElementById("resultado").innerHTML=`<h2>Nota final: ${nota}</h2>${fb}`;
document.getElementById("resultado").classList.remove("hidden");
}
